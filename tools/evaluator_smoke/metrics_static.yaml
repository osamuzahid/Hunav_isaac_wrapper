# Static-scene eval: parked robot + circulating pedestrians.
# Robot path/goal/speed metrics off — they are meaningless when Stretch is parked.
# Keep frequency 1.0 and jerk off; Arena path metrics need a moving hop.
hunav_evaluator_node:
  ros__parameters:
    frequency: 1.0
    result_file: /tmp/hunav_static_eval/metrics
    metrics:
      time_to_reach_goal: false
      path_length: false
      cumulative_heading_changes: false
      avg_distance_to_closest_person: true
      minimum_distance_to_people: true
      maximum_distance_to_people: true
      intimate_space_intrusions: true
      personal_space_intrusions: true
      social_space_intrusions: true
      arena_private_zone_intrusions: true
      arena_private_zone_time: true
      arena_max_speed_in_intimate_space: true
      arena_path_efficiency: false
      arena_angle_over_length: false
      arena_time_facing_pedestrians: true
      arena_time_seen_by_pedestrians: true
      arena_movement_towards_pedestrians: false
      group_intimate_space_intrusions: false
      group_personal_space_intrusions: false
      group_social_space_intrusions: false
      completed: false
      minimum_distance_to_target: false
      final_distance_to_target: false
      robot_on_person_collision: false
      person_on_robot_collision: true
      time_not_moving: false
      avg_robot_linear_speed: false
      avg_robot_angular_speed: false
      avg_acceleration: false
      avg_overacceleration: false
      avg_pedestrian_velocity: true
      avg_closest_pedestrian_velocity: true
      social_force_on_agents: true
      social_force_on_robot: true
      social_work: false
      obstacle_force_on_robot: false
      obstacle_force_on_agents: true
