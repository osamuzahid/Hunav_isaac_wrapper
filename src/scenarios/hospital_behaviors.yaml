hunav_loader:
  ros__parameters:
    yaml_base_name: hospital_behaviors
    simulator: Isaac Sim
    map: hospital
    publish_people: true
    # PATCH (isaac-social-nav): same human-sim setup as museum_behaviors —
    # five agents, mixed HuNav BTs, four cyclic goals each, occupancy A*.
    # Hospital adaptation: disjoint wing loops (no shared doorways). Tight
    # corridors cannot use museum's overlapping open-room goals.
    plan_goals_on_map: true
    map_yaml: hospital.yaml
    plan_waypoint_spacing_m: 1.0
    # 0.50 m > agent radius 0.4 so A* stays off wall meshes / white partitions.
    plan_inflation_radius_m: 0.50
    plan_from_init_pose: true
    ignore_obstacle_rays: false
    # Reception park. Agents patrol wings ≥12 m away; drive toward a wing
    # to trigger Curious/Scared/Surprised/Threatening (museum pattern).
    robot_init_pose:
      x: 5.0
      y: 0.0
      z: 0.0
      h: 2.9
    global_goals:
      # A1 Impassive — south hall rectangle
      1:
        x: 4.0
        y: -28.0
      2:
        x: -2.0
        y: -28.0
      3:
        x: -2.0
        y: -24.0
      4:
        x: 4.0
        y: -24.0
      # A2 Curious — north waiting
      5:
        x: -4.0
        y: 12.0
      6:
        x: 0.0
        y: 12.0
      7:
        x: 4.0
        y: 12.0
      8:
        x: 0.0
        y: 14.0
      # A3 Scared — west ward pocket
      9:
        x: -8.0
        y: -20.0
      10:
        x: -8.0
        y: -16.0
      11:
        x: -10.0
        y: -16.0
      12:
        x: -10.0
        y: -20.0
      # A4 Surprised — east ward pocket
      13:
        x: 10.0
        y: -20.0
      14:
        x: 8.0
        y: -20.0
      15:
        x: 8.0
        y: -16.0
      16:
        x: 10.0
        y: -16.0
      # A5 Threatening — mid E–W corridor (south of reception)
      17:
        x: 4.0
        y: -14.0
      18:
        x: 2.0
        y: -14.0
      19:
        x: 0.0
        y: -14.0
      20:
        x: -2.0
        y: -14.0
    agents:
      - agent1
      - agent2
      - agent3
      - agent4
      - agent5
    agent1:
      id: 1
      group_id: -1
      skin: 1
      max_vel: 1.0
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: 4.0
        y: -28.0
        z: 0.0
        h: 3.14
      behavior:
        # Impassive (2): treat robot as obstacle — Regular (1) social-force weave
        # against the robot caused rapid left/right shuffling when close.
        type: 2
        configuration: 0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "1"
        - "2"
        - "3"
        - "4"
    agent2:
      id: 2
      group_id: -1
      skin: 3
      max_vel: 0.9
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -4.0
        y: 12.0
        z: 0.0
        h: 0.0
      behavior:
        # Curious: approach then stop+look at dist (2.0 m — museum value).
        type: 5
        configuration: 1
        duration: 35.0
        once: true
        vel: 0.45
        dist: 2.0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "5"
        - "6"
        - "7"
        - "8"
    agent3:
      id: 3
      group_id: -1
      skin: 5
      max_vel: 1.0
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -8.0
        y: -20.0
        z: 0.0
        h: 1.57
      behavior:
        # Scared: HuNav adds robot repulsion (not a sprint turn). Match museum.
        type: 4
        configuration: 1
        duration: 10.0
        once: true
        vel: 1.1
        dist: 3.0
        goal_force_factor: 6.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 45.0
      goals:
        - "9"
        - "10"
        - "11"
        - "12"
    agent4:
      id: 4
      group_id: -1
      skin: 7
      max_vel: 0.85
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: 10.0
        y: -20.0
        z: 0.0
        h: 3.14
      behavior:
        type: 3
        configuration: 1
        duration: 30.0
        once: true
        vel: 0.5
        dist: 3.0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "13"
        - "14"
        - "15"
        - "16"
    agent5:
      id: 5
      group_id: -1
      skin: 9
      max_vel: 0.95
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: 4.0
        y: -14.0
        z: 0.0
        h: 3.14
      behavior:
        type: 6
        configuration: 1
        duration: 38.0
        once: true
        vel: 0.5
        dist: 1.4
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "17"
        - "18"
        - "19"
        - "20"
