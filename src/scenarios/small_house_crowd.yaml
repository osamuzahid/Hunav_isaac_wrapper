hunav_loader:
  ros__parameters:
    yaml_base_name: small_house_crowd
    simulator: Isaac Sim
    map: small_house
    publish_people: true
    # Stretch (0.0, 0.0) yaw 0 → (8.0, −3.0) yaw −0.35: living room southeast into the
    # SE room. Occupancy A* ≈ 8.7 m, ratio ≈ 1.02 to the chord — ESC/Nav2
    # likely path is this polyline, not a west-hall detour. A3–A5 stand on
    # it, staggered. A1 loops north of the hop in the living room. A2 loops
    # the south rooms and clips the hop. Inflation 0.35 m.
    plan_goals_on_map: true
    map_yaml: small_house.yaml
    plan_waypoint_spacing_m: 1.0
    plan_inflation_radius_m: 0.35
    plan_from_init_pose: true
    ignore_obstacle_rays: false
    robot_init_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      h: 0.0
    campaign_goal:
      x: 8.0
      y: -3.0
    global_goals:
      # A1 — 4-corner north of the SE hop (perimeter ≈ 6.5 m)
      1: {x: 4.20, y: 0.00}
      2: {x: 5.40, y: -0.40}
      3: {x: 6.60, y: -1.10}
      4: {x: 5.00, y: 0.90}
      # A2 — south rooms, clips the hop between A4 and A5
      5: {x: 2.90, y: -3.50}
      6: {x: 5.40, y: -3.50}
      7: {x: 5.85, y: -2.10}
      8: {x: 3.60, y: -2.50}
      # Standing — on the driven polyline, staggered, ≥2 m apart
      9: {x: 2.70, y: -0.25}
      10: {x: 4.50, y: -1.40}
      11: {x: 7.20, y: -2.80}
    agents:
      - agent1
      - agent2
      - agent3
      - agent4
      - agent5
    agent1:
      id: 1
      group_id: -1
      skin: 1
      max_vel: 0.88
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose: {x: 4.20, y: 0.00, z: 0.0, h: 0.00}
      behavior:
        type: 2
        configuration: 0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals: ["1", "2", "3", "4"]
    agent2:
      id: 2
      group_id: -1
      skin: 2
      max_vel: 0.90
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose: {x: 2.90, y: -3.50, z: 0.0, h: 0.00}
      behavior:
        type: 2
        configuration: 0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals: ["5", "6", "7", "8"]
    agent3:
      id: 3
      group_id: -1
      skin: 3
      max_vel: 0.0
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
