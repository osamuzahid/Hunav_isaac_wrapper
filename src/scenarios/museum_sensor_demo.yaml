hunav_loader:
  ros__parameters:
    yaml_base_name: museum_sensor_demo
    simulator: Isaac Sim
    map: museum
    publish_people: true
    # PATCH (isaac-social-nav): RGB-D demo — Stretch in open gallery, crowd uses
    # the same building-scale goals as museum_behaviors (not a tight local knot).
    # Earlier draft stacked 7 agents + robot on goals 1/11/12 → blob thrash.
    plan_goals_on_map: true
    map_yaml: museum.yaml
    plan_waypoint_spacing_m: 1.0
    plan_inflation_radius_m: 0.35
    plan_from_init_pose: true
    ignore_obstacle_rays: false
    # Open gallery, slightly east of the main patrol cluster so agents have room.
    robot_init_pose:
      x: -3.0
      y: -3.0
      z: 0.0
      h: 3.14
    global_goals:
      1:
        x: -6.5
        y: -3.5
      2:
        x: -18.0
        y: -5.0
      3:
        x: 10.0
        y: 5.0
      4:
        x: 2.0
        y: -8.0
      5:
        x: -15.0
        y: 8.0
      6:
        x: 0.0
        y: 10.0
      7:
        x: 8.0
        y: -2.0
      8:
        x: -20.0
        y: 0.0
      9:
        x: 11.0
        y: -10.0
      10:
        x: -4.0
        y: 14.0
    agents:
      - agent1
      - agent2
      - agent3
      - agent4
      - agent5
    # Same five behaviors / skins as museum_behaviors; init poses spread around
    # the open room (not on top of the robot). Goals are building-scale loops.
    agent1:
      id: 1
      group_id: -1
      skin: 1
      max_vel: 1.0
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -6.5
        y: -4.5
        z: 0.0
        h: 1.57
      behavior:
        type: 2
        configuration: 0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "1"
        - "2"
        - "3"
        - "4"
    agent2:
      id: 2
      group_id: -1
      skin: 3
      max_vel: 0.9
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -8.0
        y: -1.0
        z: 0.0
        h: -1.57
      behavior:
        type: 5
        configuration: 1
        duration: 35.0
        once: true
        vel: 0.45
        dist: 2.0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "7"
        - "5"
        - "6"
        - "9"
    agent3:
      id: 3
      group_id: -1
      skin: 5
      max_vel: 1.0
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -10.0
        y: -3.0
        z: 0.0
        h: 0.0
      behavior:
        type: 4
        configuration: 1
        duration: 10.0
        once: true
        vel: 1.1
        dist: 5.0
        goal_force_factor: 6.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 45.0
      goals:
        - "8"
        - "2"
        - "4"
        - "1"
    agent4:
      id: 4
      group_id: -1
      skin: 7
      max_vel: 0.85
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -5.5
        y: 2.0
        z: 0.0
        h: 3.14
      behavior:
        type: 3
        configuration: 1
        duration: 30.0
        once: true
        vel: 0.5
        dist: 4.0
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "6"
        - "10"
        - "3"
        - "7"
    agent5:
      id: 5
      group_id: -1
      skin: 9
      max_vel: 0.95
      radius: 0.4
      goal_radius: 0.6
      cyclic_goals: true
      init_pose:
        x: -1.5
        y: -6.0
        z: 0.0
        h: 0.78
      behavior:
        type: 6
        configuration: 1
        duration: 38.0
        once: true
        vel: 0.5
        dist: 1.4
        goal_force_factor: 10.0
        obstacle_force_factor: 2.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals:
        - "4"
        - "9"
        - "5"
        - "8"
